<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Producer Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>[YOUR PRODUCER NAME]</h1>
        <p>Music Producer & Audio Engineer</p>
    </header>

    <main class="gallery">
        <!-- Track 1: Embedded SoundCloud Player -->
        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Track 1 Art">
            <h3>Track Title 1</h3>
            <p>Genre / Description</p>

            <!-- Replace src with your iframe from SoundCloud/Spotify -->
            <iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" 
              src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/YOUR_TRACK_ID">
            </iframe>
        </div>

        <!-- Track 2: Native HTML5 Audio Player -->
        <div class="card">
            <img src="https://via.placeholder.com/300" alt="Track 2 Art">
            <h3>Track Title 2</h3>
            <p>Genre / Description</p>
            
            <audio controls>
                <source src="audio/your-track.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </main>

    <footer>
        <p>Contact: your.email@example.com | 
           <a href="#">Instagram</a> | 
           <a href="#">Spotify</a>
        </p>
    </footer>

</body>
</html>
